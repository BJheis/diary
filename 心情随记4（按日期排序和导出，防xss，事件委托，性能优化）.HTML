<!DOCTYPE html>
<html lang="zh">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5">
  <title>017 · 心情随记</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0d0d20;
      color: #ddd;
      font-family: 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 20px;
    }

    .container {
      max-width: 640px;
      width: 100%;
      background: #17172e;
      border-radius: 36px;
      padding: 28px 22px 34px;
      box-shadow: 0 12px 48px rgba(0, 0, 0, 0.6);
    }

    h1 {
      font-size: 24px;
      font-weight: 300;
      letter-spacing: 2px;
      color: #f0e6c0;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    h1 small { font-size: 14px; color: #768fa8; font-weight: 300; }

    /* ---- 预设色板 ---- */
    .color-preset {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 12px;
      margin-bottom: 18px;
      padding: 12px 14px;
      background: #121225;
      border-radius: 24px;
      border: 1px solid #282842;
      align-items: center;
    }
    .color-preset .label {
      font-size: 13px;
      color: #8a9aaa;
      margin-right: 4px;
      width: 100%;
    }
    .color-preset .mood-group {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #1a1a32;
      padding: 4px 12px 4px 8px;
      border-radius: 40px;
      border: 1px solid #2a2a44;
      cursor: pointer;
      position: relative;
    }
    .color-preset .mood-group .mood-label { font-size: 13px; color: #c8d0dc; margin-right: 2px; user-select: none; }
    .color-preset .mood-group .selected-swatch {
      width: 28px; height: 28px;
      border-radius: 50%;
      border: 2px solid #2e2e4a;
      flex-shrink: 0;
      transition: 0.15s;
    }
    .color-preset .mood-group .selected-swatch:hover { transform: scale(1.05); }

    .color-preset .mood-group .swatch-dropdown {
      display: none;
      position: absolute;
      top: calc(100% + 8px);
      left: 48px;
      transform: translateX(-50%);
      background: #1f1f3a;
      border: 1px solid #3a3a5a;
      border-radius: 20px;
      padding: 8px 10px;
      gap: 6px;
      flex-wrap: wrap;
      width: 130px;
      z-index: 20;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      justify-content: center;
    }
    .color-preset .mood-group .swatch-dropdown.open { display: flex; }
    .color-preset .mood-group .swatch-dropdown .color-swatch {
      display: inline-block;
      width: 32px; height: 32px;
      border-radius: 50%;
      border: 2px solid #2e2e4a;
      cursor: pointer;
      transition: 0.15s;
      flex-shrink: 0;
    }
    .color-preset .mood-group .swatch-dropdown .color-swatch:hover { transform: scale(1.12); border-color: #b8a080; }
    .color-preset .mood-group .swatch-dropdown .color-swatch.active {
      border-color: #f0e6c0;
      box-shadow: 0 0 0 2px #0d0d20, 0 0 0 4px #b8a080;
    }

    /* ---- 输入区 ---- */
    .input-area {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 18px;
    }
    .input-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .input-row input,
    .input-row select {
      flex: 1 1 140px;
      padding: 10px 14px;
      border-radius: 40px;
      border: 1px solid #2e2e4a;
      background: #1f1f38;
      color: #ddd;
      font-size: 14px;
      outline: none;
      transition: 0.25s;
    }
    .input-row input:focus,
    .input-row select:focus {
      border-color: #b8a080;
      box-shadow: 0 0 0 3px rgba(184, 160, 128, 0.15);
    }
    .input-row input::placeholder { color: #9090ad; }
    .input-row select option { background: #1f1f38; }

    .btn-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .btn-group button {
      padding: 10px 22px;
      border-radius: 40px;
      border: none;
      background: #2e2e4e;
      color: #ddd;
      font-size: 14px;
      cursor: pointer;
      transition: 0.2s;
      flex: 1 1 auto;
    }
    .btn-group button:hover { background: #3e3e5e; color: #fff; }
    .btn-group .primary {
      background: #ffeca5;
      color: #0d0d20;
    }
    .btn-group .primary:hover {
      background: #ffdc5e;
      color: #0d0d20;
    }

    /* ---- 搜索区 ---- */
    .search-area {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 16px 0 14px;
      padding: 12px 14px;
      background: #121225;
      border-radius: 28px;
      border: 1px solid #282842;
      align-items: center;
    }
    .search-area input,
    .search-area select {
      flex: 1 1 110px;
      padding: 8px 14px;
      border-radius: 30px;
      border: 1px solid #2e2e4a;
      background: #1a1a32;
      color: #ddd;
      font-size: 13px;
      outline: none;
    }
    .search-area input::placeholder { color: #9090ad; }
    .search-area input:focus,
    .search-area select:focus { border-color: #b8a080; }
    .search-area .search-btn {
      flex: 0 0 auto;
      padding: 8px 18px;
      border-radius: 30px;
      border: none;
      background: #2e2e4e;
      color: #ddd;
      cursor: pointer;
      transition: 0.2s;
      font-size: 13px;
    }
    .search-area .search-btn:hover { background: #3e3e5e; }
    .search-area .clear-search {
      flex: 0 0 auto;
      padding: 8px 14px;
      border-radius: 30px;
      border: 1px solid #3a2a2a;
      background: transparent;
      color: #bd7171;
      cursor: pointer;
      font-size: 13px;
      transition: 0.2s;
    }
    .search-area .clear-search:hover { border-color: #7a4a4a; color: #c0a0a0; }

    /* ---- 统计 ---- */
    .stats {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 14px;
      font-size: 13px;
      color: #8a9aaa;
      padding: 8px 6px 12px;
      border-bottom: 1px solid #282842;
      margin-bottom: 12px;
    }
    .stats .count { color: #e0d8c0; font-weight: 400; }

    /* ---- 列表 ---- */
    .list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 420px;
      overflow-y: auto;
      padding-right: 4px;
    }
    .list::-webkit-scrollbar { width: 4px; }
    .list::-webkit-scrollbar-thumb { background: #3a3a5a; border-radius: 10px; }

    .entry {
      background: #1a1a34;
      border-radius: 20px;
      padding: 14px 18px;
      border-left: 6px solid #4a4a6a;
      transition: 0.15s;
      display: flex;
      flex-direction: column;
      gap: 4px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
      word-break: break-word;
    }
    .entry .meta {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: #7a8a9a;
      margin-bottom: 2px;
    }
    .entry .meta .date { letter-spacing: 0.5px; }
    .entry .mood-tag {
      font-size: 12px;
      background: #28284a;
      padding: 2px 12px;
      border-radius: 30px;
      color: #c0c8d8;
    }
    .entry .content {
      font-size: 15px;
      line-height: 1.5;
      color: #e8e0d0;
      padding: 4px 0 2px;
    }
    .entry .content .highlight { background: #f0d08040; color: #f0d080; padding: 0 4px; border-radius: 4px; }
    .entry .actions {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 6px;
    }
    .entry .actions button {
      background: transparent;
      border: none;
      color: #5a5a7a;
      font-size: 13px;
      cursor: pointer;
      transition: 0.2s;
      padding: 2px 6px;
    }
    .entry .actions button:hover { color: #d0a0a0; }

    .empty-state {
      text-align: center;
      color: #4a5a6a;
      padding: 40px 10px;
      font-size: 15px;
      letter-spacing: 1px;
    }
    .empty-state small {
      display: block;
      margin-top: 8px;
      font-size: 13px;
      color: #3a4a5a;
    }

    /* ---- 导出日期范围 ---- */
    .export-range {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 12px;
      align-items: center;
      margin-top: 14px;
      padding: 12px 14px;
      background: #121225;
      border-radius: 28px;
      border: 1px solid #282842;
    }
    .export-range .range-label {
      font-size: 13px;
      color: #8a9aaa;
      display: flex;
      align-items: center;
      gap: 4px; 
      white-space: nowrap; 
    }
    .export-range .range-label .hint {
      font-size: 12px;
      color: #6a7a8a;
      font-weight: 300;
    }
    .export-range input[type="date"] {
      padding: 6px 10px;
      border-radius: 30px;
      border: 1px solid #2e2e4a;
      background: #1a1a32;
      color: #ddd;
      font-size: 13px;
      outline: none;
      max-width: 140px;
    }
    .export-range input[type="date"]:focus { border-color: #b8a080; }
    .export-range .range-hint {
      font-size: 12px;
      color: #4a5a6a;
      margin-left: 4px;
    }

    /* ---- footer ---- */
    .footer-actions {
      display: flex;
      flex-wrap: nowrap;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 18px;
      border-top: 1px solid #282842;
      padding-top: 16px;
    }
    .footer-actions button {
      background: transparent;
      border: none;
      color: #9090d6;
      font-size: 13px;
      cursor: pointer;
      transition: 0.2s;
      padding: 4px 8px;
    }
    .footer-actions button:hover { color: #e1e1ff; }

    /* ---- 自定义颜色行 ---- */
    #customColorRow {
      display: none;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      background: #121225;
      padding: 8px 14px;
      border-radius: 40px;
      border: 1px solid #2e2e4a;
    }
    #customColorRow input[type="text"] {
      flex: 1;
      min-width: 80px;
      padding: 8px 14px;
      border-radius: 50px;
      border: 1px solid #2e2e4a;
      background: #1f1f38;
      color: #ddd;
      font-size: 14px;
      outline: none;
    }
    #customColorRow .custom-swatch-group {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
    }
    #customColorRow .custom-swatch-group .swatch {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 2px solid #2e2e4a;
      cursor: pointer;
      transition: 0.15s;
    }
    #customColorRow .custom-swatch-group .swatch:hover { transform: scale(1.1); }
    #customColorRow .custom-swatch-group .swatch.active {
      border-color: #f0e6c0;
      box-shadow: 0 0 0 2px #0d0d20, 0 0 0 4px #b8a080;
    }

    /* ---- 响应式 ---- */
    @media (max-width: 420px) {
      .container { padding: 18px 14px; }
      .input-row input,
      .input-row select { flex: 1 1 100%; }
      .color-preset .mood-group { padding: 4px 8px; }
      .color-preset .mood-group .swatch-dropdown { width: 130px; }
      #customColorRow { flex-wrap: wrap; gap: 6px; padding: 8px 10px; border-radius: 30px; }
      #customColorRow .custom-swatch-group { gap: 4px; flex: 1 1 100%; justify-content: center; }
      #customColorRow .custom-swatch-group .swatch { width: 30px; height: 30px; flex: 0 0 30px; }
      #customColorRow input[type="text"] { flex: 1 1 100%; min-width: 100%; }
      #customColorRow>span { display: none; }
      .export-range input[type="date"] { max-width: 100px; }
    }
  </style>
</head>

<body>
  <div class="container" id="app">
    <h1>✦ 随记 <small>017</small></h1>

    <!-- 预设色板 -->
    <div class="color-preset" id="colorPresetPanel">
      <span class="label">🎨 情绪色板（点击色块展开选色）</span>

      <div class="mood-group" data-mood="开心">
        <span class="mood-label">😊</span>
        <span class="selected-swatch" style="background:#f0e6a0;"></span>
        <div class="swatch-dropdown">
          <span class="color-swatch" style="background:#f0e6a0;" data-color="#f0e6a0"></span>
          <span class="color-swatch" style="background:#fadc49;" data-color="#fadc49"></span>
          <span class="color-swatch" style="background:#ffb347;" data-color="#ffb347"></span>
          <span class="color-swatch" style="background:#f4d178;" data-color="#f4d178"></span>
          <span class="color-swatch" style="background:#e8b830;" data-color="#e8b830"></span>
          <span class="color-swatch" style="background:#ff8c42;" data-color="#ff8c42"></span>
        </div>
      </div>

      <div class="mood-group" data-mood="平淡">
        <span class="mood-label">😐</span>
        <span class="selected-swatch" style="background: #9bcca4;"></span>
        <div class="swatch-dropdown">
          <span class="color-swatch" style="background:#9bcca4;" data-color="#9bcca4"></span>
          <span class="color-swatch" style="background:#88d475;" data-color="#88d475"></span>
          <span class="color-swatch" style="background:#19a031;" data-color="#19a031"></span>
          <span class="color-swatch" style="background:#7a9d82;" data-color="#7a9d82"></span>
          <span class="color-swatch" style="background:#489c5a;" data-color="#489c5a"></span>
          <span class="color-swatch" style="background:#166121;" data-color="#166121"></span>
        </div>
      </div>

      <div class="mood-group" data-mood="难过">
        <span class="mood-label">😢</span>
        <span class="selected-swatch" style="background:#badbf9;"></span>
        <div class="swatch-dropdown">
          <span class="color-swatch" style="background:#badbf9;" data-color="#badbf9"></span>
          <span class="color-swatch" style="background:#5ba2e5;" data-color="#5ba2e5"></span>
          <span class="color-swatch" style="background:#2674c1;" data-color="#2674c1"></span>
          <span class="color-swatch" style="background:#8fb0cc;" data-color="#8fb0cc"></span>
          <span class="color-swatch" style="background:#467bb1;" data-color="#467bb1"></span>
          <span class="color-swatch" style="background:#163e69;" data-color="#163e69"></span>
        </div>
      </div>

      <div class="mood-group" data-mood="生气">
        <span class="mood-label">😡</span>
        <span class="selected-swatch" style="background:#eea3a3;"></span>
        <div class="swatch-dropdown">
          <span class="color-swatch" style="background:#eea3a3;" data-color="#eea3a3"></span>
          <span class="color-swatch" style="background:#ea6a6a;" data-color="#ea6a6a"></span>
          <span class="color-swatch" style="background:#b83333;" data-color="#b83333"></span>
          <span class="color-swatch" style="background:#d07373;" data-color="#d07373"></span>
          <span class="color-swatch" style="background:#a74141;" data-color="#a74141"></span>
          <span class="color-swatch" style="background:#881b1b;" data-color="#881b1b"></span>
        </div>
      </div>

      <div class="mood-group" data-mood="心动">
        <span class="mood-label">💗</span>
        <span class="selected-swatch" style="background:#ffbacb;"></span>
        <div class="swatch-dropdown">
          <span class="color-swatch" style="background:#ffbacb;" data-color="#ffbacb"></span>
          <span class="color-swatch" style="background:#f986ac;" data-color="#f986ac"></span>
          <span class="color-swatch" style="background:#f93f7d;" data-color="#f93f7d"></span>
          <span class="color-swatch" style="background:#d48ba5;" data-color="#d48ba5"></span>
          <span class="color-swatch" style="background:#da5783;" data-color="#da5783"></span>
          <span class="color-swatch" style="background:#ba114f;" data-color="#ba114f"></span>
        </div>
      </div>
    </div>

    <!-- 输入区 -->
    <div class="input-area">
      <div class="input-row">
        <input type="text" id="contentInput" placeholder="今天想记点什么…">
        <input type="date" id="dateInput">
        <select id="moodSelect">
          <option value="开心">开心</option>
          <option value="平淡">平淡</option>
          <option value="难过">难过</option>
          <option value="生气">生气</option>
          <option value="心动">心动</option>
          <option value="自定义">自定义</option>
        </select>
      </div>
      <div id="customColorRow">
        <input type="text" id="customMoodName" placeholder="情绪名称">
        <span style="font-size:13px; color:#8a9aaa;">颜色</span>
        <div class="custom-swatch-group" id="customSwatchGroup"></div>
      </div>
      <div class="btn-group">
        <button class="primary" id="saveBtn">保存</button>
        <button id="clearInputBtn">清空输入</button>
      </div>
    </div>

    <!-- 搜索区 -->
    <div class="search-area">
      <input type="text" id="searchKeyword" placeholder="关键词…">
      <input type="date" id="searchDate">
      <select id="searchMood">
        <option value="">全部情绪</option>
        <option value="开心">😊 开心</option>
        <option value="平淡">😐 平淡</option>
        <option value="难过">😢 难过</option>
        <option value="生气">😡 生气</option>
        <option value="心动">💗 心动</option>
        <option value="自定义">✨ 自定义</option>
      </select>
      <button class="search-btn" id="searchBtn">搜索</button>
      <button class="clear-search" id="clearSearchBtn">清除</button>
    </div>

    <!-- 统计 -->
    <div class="stats" id="statsBar">
      <span>📄 共 <span class="count" id="totalCount">0</span> 条</span>
      <span>😊 <span class="count" id="happyCount">0</span></span>
      <span>😐 <span class="count" id="neutralCount">0</span></span>
      <span>😢 <span class="count" id="sadCount">0</span></span>
      <span>😡 <span class="count" id="angryCount">0</span></span>
      <span>💗 <span class="count" id="heartCount">0</span></span>
    </div>

    <!-- 列表 -->
    <div class="list" id="entryList">
      <div class="empty-state">还没有记录<br><small>写下今天的心情吧</small></div>
    </div>

    <!-- 导出日期范围 + 操作按钮 -->
    <div class="export-range" id="exportRange">
      <label class="range-label">
        📅 导出范围（留空则全部）
      </label>
      <input type="date" id="exportDateFrom">
      <span style="color:#8a9aaa; font-size:14px;">至</span>
      <input type="date" id="exportDateTo">
    </div>

    <div class="footer-actions">
      <button id="exportJsonBtn">📤 导出 JSON</button>
      <button id="importJsonBtn">📥 导入 JSON</button>
      <button id="clearAllBtn" style="color:#b53333;">清空所有</button>
      <input type="file" id="fileInput" accept=".json" style="display:none;">
    </div>
  </div>

  <script>
    // ---- 核心数据 ----
    const STORAGE_KEY = '017_mood_notes';
    let notes = [];
    let currentFilter = { keyword: '', date: '', mood: '' };

    // ---- 转义 HTML 防止 XSS ----
    function escapeHtml(text) {
      if (!text) return '';
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // ---- 性能优化缓存 ----
    let cachedFiltered = [];
    let cachedFilter = {};

    // ---- 预设颜色 ----
    const presetColors = {
      '开心': ['#f0e6a0', '#fadc49', '#ffb347', '#f4d178', '#e8b830', '#ff8c42'],
      '平淡': ['#9bcca4', '#88d475', '#19a031', '#7a9d82', '#489c5a', '#166121'],
      '难过': ['#badbf9', '#5ba2e5', '#2674c1', '#8fb0cc', '#467bb1', '#163e69'],
      '生气': ['#eea3a3', '#ea6a6a', '#b83333', '#d07373', '#a74141', '#881b1b'],
      '心动': ['#ffbacb', '#f986ac', '#f93f7d', '#d48ba5', '#da5783', '#ba114f'],
      '自定义': ['#b39ddb', '#9575cd', '#7e57c2', '#b8a080', '#a1887f', '#8a6e5a', '#f5e6d0', '#dce8e0']
    };

    let moodSelectedColor = {
      '开心': '#f0e6a0',
      '平淡': '#9bcca4',
      '难过': '#badbf9',
      '生气': '#eea3a3',
      '心动': '#ffbacb',
      '自定义': '#b39ddb'
    };

    function loadSelectedColors() {
      try {
        const saved = localStorage.getItem('mood_selected_colors');
        if (saved) {
          const parsed = JSON.parse(saved);
          Object.keys(parsed).forEach(key => {
            if (moodSelectedColor.hasOwnProperty(key)) moodSelectedColor[key] = parsed[key];
          });
        }
      } catch {}
    }
    function saveSelectedColors() { localStorage.setItem('mood_selected_colors', JSON.stringify(moodSelectedColor)); }

    function getMoodColor(mood, customMood, customColor) {
      if (mood === '自定义' && customMood && customColor) return customColor;
      return moodSelectedColor[mood] || '#4a4a6a';
    }

    // ---- 数据读写 ----
    function loadNotes() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          notes = JSON.parse(raw);
          if (!Array.isArray(notes)) notes = [];
          notes = notes.filter(n => n && typeof n === 'object' && n.content);
          notes.forEach(n => { if (!n.id) n.id = Date.now() + '_' + Math.random().toString(36).substr(2, 5); });
        } else notes = [];
      } catch { notes = []; }
    }
    function saveNotes() { localStorage.setItem(STORAGE_KEY, JSON.stringify(notes)); }

    // ---- 排序：按 date 升序，同日期按 timestamp ----
    function sortNotes(arr) {
      return arr.slice().sort((a, b) => {
        const da = a.date || '';
        const db = b.date || '';
        if (da !== db) return da.localeCompare(db);
        return (a.timestamp || 0) - (b.timestamp || 0);
      });
    }

    // ---- 渲染 ----
    function render() {
      const list = document.getElementById('entryList');
      const totalSpan = document.getElementById('totalCount');
      const happySpan = document.getElementById('happyCount');
      const neutralSpan = document.getElementById('neutralCount');
      const sadSpan = document.getElementById('sadCount');
      const angrySpan = document.getElementById('angryCount');
      const heartSpan = document.getElementById('heartCount');

      // 计算过滤结果
      let filtered = notes;
      if (currentFilter.date) filtered = filtered.filter(n => n.date === currentFilter.date);
      if (currentFilter.keyword && currentFilter.keyword.trim() !== '') {
        const kw = currentFilter.keyword.trim().toLowerCase();
        filtered = filtered.filter(n => n.content.toLowerCase().includes(kw));
      }
      if (currentFilter.mood) {
        const moodToMatch = currentFilter.mood;
        filtered = filtered.filter(n => {
          if (moodToMatch === '自定义') return n.mood === '自定义';
          return n.mood === moodToMatch;
        });
      }
      filtered = sortNotes(filtered);

      // 检查是否需要重新渲染
      const filterChanged = JSON.stringify(currentFilter) !== JSON.stringify(cachedFilter);
      const countChanged = filtered.length !== cachedFiltered.length;
      
      if (!filterChanged && !countChanged) {
        let contentChanged = false;
        for (let i = 0; i < filtered.length; i++) {
          if (filtered[i].id !== cachedFiltered[i]?.id || 
              filtered[i].content !== cachedFiltered[i]?.content ||
              filtered[i].date !== cachedFiltered[i]?.date ||
              filtered[i].mood !== cachedFiltered[i]?.mood) {
            contentChanged = true;
            break;
          }
        }
        if (!contentChanged) {
          // 内容没变，跳过渲染
          return;
        }
      }

      // 更新缓存
      cachedFilter = JSON.parse(JSON.stringify(currentFilter));
      cachedFiltered = filtered.map(n => ({ ...n }));

      // 更新统计
      const total = notes.length;
      const counts = { '开心': 0, '平淡': 0, '难过': 0, '生气': 0, '心动': 0 };
      notes.forEach(n => { if (counts.hasOwnProperty(n.mood)) counts[n.mood]++; });

      totalSpan.textContent = total;
      happySpan.textContent = counts['开心'] || 0;
      neutralSpan.textContent = counts['平淡'] || 0;
      sadSpan.textContent = counts['难过'] || 0;
      angrySpan.textContent = counts['生气'] || 0;
      heartSpan.textContent = counts['心动'] || 0;

      if (filtered.length === 0) {
        list.innerHTML = `<div class="empty-state">没有匹配的记录<br><small>${notes.length === 0 ? '写一条吧' : '试试其他搜索条件'}</small></div>`;
        return;
      }

      // 使用 DocumentFragment 高效构建
      const fragment = document.createDocumentFragment();
      
      filtered.forEach((n) => {
        const entryDiv = document.createElement('div');
        entryDiv.className = 'entry';
        const color = getMoodColor(n.mood, n.customMood, n.customColor);
        entryDiv.style.borderLeftColor = color;
        
        // Meta 信息
        const metaDiv = document.createElement('div');
        metaDiv.className = 'meta';
        
        const dateSpan = document.createElement('span');
        dateSpan.className = 'date';
        dateSpan.textContent = n.date || '未知日期';
        
        const moodSpan = document.createElement('span');
        moodSpan.className = 'mood-tag';
        moodSpan.style.background = color + '40';
        moodSpan.style.color = color;
        const moodLabel = n.mood === '自定义' ? (n.customMood || '自定义') : n.mood;
        moodSpan.textContent = moodLabel;
        
        metaDiv.appendChild(dateSpan);
        metaDiv.appendChild(moodSpan);
        
        // 内容（已转义，防止 XSS）
        const contentDiv = document.createElement('div');
        contentDiv.className = 'content';
        let contentHtml = escapeHtml(n.content);
        if (currentFilter.keyword && currentFilter.keyword.trim() !== '') {
          const kw = escapeHtml(currentFilter.keyword.trim());
          const regex = new RegExp(`(${kw.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
          contentHtml = contentHtml.replace(regex, '<span class="highlight">$1</span>');
        }
        contentDiv.innerHTML = contentHtml;
        
        // 操作按钮
        const actionsDiv = document.createElement('div');
        actionsDiv.className = 'actions';
        
        const delBtn = document.createElement('button');
        delBtn.className = 'del-btn';
        delBtn.dataset.id = n.id;
        delBtn.textContent = '删除';
        
        actionsDiv.appendChild(delBtn);
        
        entryDiv.appendChild(metaDiv);
        entryDiv.appendChild(contentDiv);
        entryDiv.appendChild(actionsDiv);
        
        fragment.appendChild(entryDiv);
      });
      
      list.innerHTML = '';
      list.appendChild(fragment);
    }

    // ---- 保存新记录 ----
    function saveNewNote() {
      const content = document.getElementById('contentInput').value.trim();
      const date = document.getElementById('dateInput').value;
      const mood = document.getElementById('moodSelect').value;
      if (!content) { alert('请写点什么'); return; }
      let customMood = '',
        customColor = '';
      if (mood === '自定义') {
        customMood = document.getElementById('customMoodName').value.trim();
        const activeSwatch = document.querySelector('#customSwatchGroup .swatch.active');
        customColor = activeSwatch ? activeSwatch.dataset.color : '#6a9a7a';
        if (!customMood) { alert('请输入自定义情绪名称'); return; }
      }
      const dateStr = date || new Date().toISOString().slice(0, 10);
      notes.push({
        id: Date.now() + '_' + Math.random().toString(36).substr(2, 5),
        content,
        date: dateStr,
        mood,
        customMood,
        customColor,
        timestamp: Date.now(),
      });
      saveNotes();
      document.getElementById('contentInput').value = '';
      document.getElementById('dateInput').value = '';
      document.getElementById('moodSelect').value = '开心';
      document.getElementById('customColorRow').style.display = 'none';
      document.getElementById('customMoodName').value = '';
      render();
    }

    // ---- 搜索 ----
    function applySearch() {
      currentFilter.keyword = document.getElementById('searchKeyword').value;
      currentFilter.date = document.getElementById('searchDate').value;
      currentFilter.mood = document.getElementById('searchMood').value;
      render();
    }
    function clearSearch() {
      document.getElementById('searchKeyword').value = '';
      document.getElementById('searchDate').value = '';
      document.getElementById('searchMood').value = '';
      currentFilter = { keyword: '', date: '', mood: '' };
      render();
    }

    // ---- 导出（按日期范围） ----
    function exportJson() {
      const fromDate = document.getElementById('exportDateFrom').value;
      const toDate = document.getElementById('exportDateTo').value;

      let exportData = notes;
      if (fromDate) exportData = exportData.filter(n => n.date && n.date >= fromDate);
      if (toDate) exportData = exportData.filter(n => n.date && n.date <= toDate);

      if (exportData.length === 0) { alert('该日期范围内没有记录'); return; }

      const sorted = sortNotes(exportData);
      const blob = new Blob([JSON.stringify(sorted, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      const dateStr = new Date().toISOString().slice(0, 10);
      a.download = `心情随记_${dateStr}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    // ---- 导入 ----
    function importJson(file) {
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const data = JSON.parse(e.target.result);
          if (!Array.isArray(data)) throw new Error('');
          const valid = data.filter(n => n && typeof n === 'object' && n.content);
          if (valid.length === 0) { alert('没有有效的记录'); return; }

          valid.forEach(n => {
            if (!n.id) n.id = Date.now() + '_' + Math.random().toString(36).substr(2, 5);
          });

          // 去重合并
          const existingFingerprints = new Set();
          notes.forEach(n => { const fp = `${n.content}|${n.date}`;
            existingFingerprints.add(fp); });
          const existingIds = new Set();
          notes.forEach(n => { if (n.id) existingIds.add(n.id); });

          let addedCount = 0,
            duplicateCount = 0;
          valid.forEach(n => {
            const fp = `${n.content}|${n.date}`;
            if (existingIds.has(n.id) || existingFingerprints.has(fp)) { duplicateCount++; return; }
            notes.push(n);
            existingIds.add(n.id);
            existingFingerprints.add(fp);
            addedCount++;
          });

          saveNotes();
          render();
          alert(`✅ 导入完成！\n新增 ${addedCount} 条，跳过重复 ${duplicateCount} 条。`);
        } catch (err) {
          alert('❌ 文件格式错误，请选择正确的 JSON 文件');
          console.error(err);
        }
      };
      reader.readAsText(file);
    }

    function clearAll() {
      if (notes.length === 0) return;
      if (confirm('确定要清空所有记录吗？此操作不可撤销。')) {
        notes = [];
        saveNotes();
        render();
      }
    }

    // ---- 初始化色板 ----
    function initColorPalette() {
      document.querySelectorAll('.mood-group').forEach(group => {
        const dropdown = group.querySelector('.swatch-dropdown');
        const selectedSwatch = group.querySelector('.selected-swatch');

        group.addEventListener('click', function(e) {
          e.stopPropagation();
          document.querySelectorAll('.mood-group .swatch-dropdown').forEach(d => {
            if (d !== dropdown) d.classList.remove('open');
          });
          dropdown.classList.toggle('open');
        });

        dropdown.querySelectorAll('.color-swatch').forEach(sw => {
          sw.addEventListener('click', function(e) {
            e.stopPropagation();
            const color = this.dataset.color;
            if (!color) return;
            const mood = group.dataset.mood;
            if (!mood) return;

            dropdown.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
            this.classList.add('active');
            selectedSwatch.style.background = color;
            moodSelectedColor[mood] = color;
            saveSelectedColors();
            dropdown.classList.remove('open');
            render();
          });
        });

        dropdown.addEventListener('click', function(e) { e.stopPropagation(); });
      });

      document.addEventListener('click', function() {
        document.querySelectorAll('.mood-group .swatch-dropdown').forEach(d => d.classList.remove('open'));
      });

      // 恢复已选颜色
      function restoreSelected() {
        document.querySelectorAll('.mood-group').forEach(group => {
          const mood = group.dataset.mood;
          const selected = moodSelectedColor[mood];
          if (selected) {
            const selectedSwatch = group.querySelector('.selected-swatch');
            if (selectedSwatch) selectedSwatch.style.background = selected;
            const dropdown = group.querySelector('.swatch-dropdown');
            if (dropdown) {
              dropdown.querySelectorAll('.color-swatch').forEach(s => {
                s.classList.toggle('active', s.dataset.color === selected);
              });
            }
          }
        });
      }

      // 自定义颜色
      function buildCustomSwatchRow() {
        const container = document.getElementById('customSwatchGroup');
        container.innerHTML = '';
        const customColors = presetColors['自定义'];
        customColors.forEach(col => {
          const sw = document.createElement('span');
          sw.className = 'swatch';
          sw.style.background = col;
          sw.dataset.color = col;
          sw.addEventListener('click', function(e) {
            e.stopPropagation();
            const color = this.dataset.color;
            container.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
            this.classList.add('active');
            moodSelectedColor['自定义'] = color;
            saveSelectedColors();
            render();
          });
          container.appendChild(sw);
        });
        const selected = moodSelectedColor['自定义'];
        container.querySelectorAll('.swatch').forEach(s => {
          s.classList.toggle('active', s.dataset.color === selected);
        });
      }

      buildCustomSwatchRow();
      restoreSelected();

      document.getElementById('moodSelect').addEventListener('change', function() {
        const show = this.value === '自定义';
        document.getElementById('customColorRow').style.display = show ? 'flex' : 'none';
        if (show) {
          const selected = moodSelectedColor['自定义'];
          document.querySelectorAll('#customSwatchGroup .swatch').forEach(s => {
            s.classList.toggle('active', s.dataset.color === selected);
          });
        }
      });
    }

    // ---- 初始化 ----
    function init() {
      loadSelectedColors();
      loadNotes();
      initColorPalette();

      document.getElementById('saveBtn').addEventListener('click', saveNewNote);
      document.getElementById('clearInputBtn').addEventListener('click', function() {
        document.getElementById('contentInput').value = '';
        document.getElementById('dateInput').value = '';
        document.getElementById('moodSelect').value = '开心';
        document.getElementById('customColorRow').style.display = 'none';
        document.getElementById('customMoodName').value = '';
      });

      document.getElementById('searchBtn').addEventListener('click', applySearch);
      document.getElementById('clearSearchBtn').addEventListener('click', clearSearch);
      document.getElementById('searchKeyword').addEventListener('keydown', e => { if (e.key === 'Enter') applySearch(); });
      document.getElementById('searchDate').addEventListener('keydown', e => { if (e.key === 'Enter') applySearch(); });
      document.getElementById('searchMood').addEventListener('change', applySearch);

      document.getElementById('contentInput').addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !e.shiftKey && document.activeElement === this) {
          e.preventDefault();
          saveNewNote();
        }
      });

      document.getElementById('exportJsonBtn').addEventListener('click', exportJson);
      document.getElementById('importJsonBtn').addEventListener('click', function() { document.getElementById('fileInput').click(); });
      document.getElementById('fileInput').addEventListener('change', function(e) {
        if (this.files && this.files.length > 0) { importJson(this.files[0]); }
        this.value = '';
      });
      document.getElementById('clearAllBtn').addEventListener('click', clearAll);

      document.getElementById('dateInput').value = new Date().toISOString().slice(0, 10);

      // ---- 事件委托：删除按钮 ----
      document.getElementById('entryList').addEventListener('click', function(e) {
        const btn = e.target.closest('.del-btn');
        if (!btn) return;
        
        const id = btn.dataset.id;
        const idx = notes.findIndex(n => n.id === id);
        if (idx === -1) return;
        if (confirm('确定删除这条记录吗？')) {
          notes.splice(idx, 1);
          saveNotes();
          render();
        }
      });

      render();
    }

    init();
  </script>
